<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Purnasatwa</title>

 <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">
        <h2>PURNASATWA</h2>
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="recipe.html">Recipes</a></li>
            <li><a href="subscriptions.html">Subscriptions</a></li>
            <li><a href="cart.html">Cart</a></li>
        </ul>
    </nav>

</header>

<section class="contact">

    <div class="contact-info">

        <h2>Checkout</h2>

        <p>Enter your delivery details.</p>

    </div>

    <form class="contact-form" id="checkoutForm">

        <input type="text" id="coName" placeholder="Full Name" required>

        <input type="text" id="coPhone" placeholder="Mobile Number" required>

        <input type="text" id="coAddress" placeholder="Address" required>

        <input type="text" id="coCity" placeholder="City" required>

        <input type="text" id="coPin" placeholder="Pincode" required>

        <button type="submit" id="placeOrderBtn">
            Place Order
        </button>

    </form>

</section>

<script src="script.js"></script>

</body>
</html>
